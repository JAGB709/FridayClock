name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Lint (informativo)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-clock-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Comprobar puente y skill (Python)
        run: python3 -m py_compile homelab/clock-bridge/bridge.py homelab/hermes-skill/mi-smart-clock/scripts/clock.py
