# Un solo aviso al mes y agrupado, para no llenar el repositorio de ramas y correos.
# Las subidas mayores de Gradle/Kotlin/AGP se hacen a mano (pueden romper la app).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories: [/homelab/friday-panel, /homelab/clock-bridge]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/homelab/friday-panel, /homelab/clock-bridge]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle:
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
